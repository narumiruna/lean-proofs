name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
      - uses: astral-sh/setup-uv@v6
      - name: Check exercise inventory and proof trust
        run: ./scripts/check.sh --final
